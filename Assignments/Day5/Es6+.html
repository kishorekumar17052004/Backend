const getHighestMark = (...marks)=> {
    let highest = marks[0];

    for (let i = 1; i < marks.length; i++) {
        if (marks[i] > highest) {
            highest = marks[i];
        }
    }

    return highest;
}

 const mergeCourses = (...courseArrays)=> {
    let merged = [];

    for (let courses of courseArrays) {
        merged = [...merged, ...courses];
    }

    return merged;
}

let employees = [];

const addEmployee = (id, name, salary = 0) => {
    const employee = { id, name, salary };

    employees = [...employees, employee];
    console.log(`${name} added successfully`);
};


const updateEmployee = (id, newSalary) => {
    employees = employees.map(emp =>
        emp.id === id ? { ...emp, salary: newSalary } : emp
    );
};


const displayEmployee = (id) => {
    const employee = employees.find(emp => emp.id === id);

    const {
        name = "Unknown",
        salary = 0
    } = employee ?? {}; 

    console.log(`Name: ${name}, Salary: ₹${salary}`);
};

// Calculate Salary
const calculateSalary = (...amounts) => {
    let total = 0;

    for (let amount of amounts) {
        total += amount;
    }

    return total;
};

addEmployee(1, "Kishore", 50000);

displayEmployee(1);

updateEmployee(1, 60000);

displayEmployee(1);

console.log(`Total Salary: ₹${calculateSalary(60000, 5000, 2000)}`);
